name: shortlinks

services:
  app:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-shortlinks}?connectTimeout=3&socketTimeout=5
      POSTGRES_USER: ${POSTGRES_USER:-shortlinks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      CACHE_POSITIVE_TTL: ${CACHE_POSITIVE_TTL:-60s}
      CACHE_NEGATIVE_TTL: ${CACHE_NEGATIVE_TTL:-5s}
      REDIS_CONNECT_TIMEOUT: ${REDIS_CONNECT_TIMEOUT:-200ms}
      REDIS_COMMAND_TIMEOUT: ${REDIS_COMMAND_TIMEOUT:-200ms}
      CACHE_FAILURE_WINDOW: ${CACHE_FAILURE_WINDOW:-10}
      CACHE_OPEN_DURATION: ${CACHE_OPEN_DURATION:-5s}
      CACHE_FAILURE_RATE_THRESHOLD: ${CACHE_FAILURE_RATE_THRESHOLD:-50}
      CACHE_HALF_OPEN_CALLS: ${CACHE_HALF_OPEN_CALLS:-2}
      MANAGEMENT_ADDRESS: 0.0.0.0
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
      - "127.0.0.1:${MANAGEMENT_PORT:-9090}:9090"
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 30s
  postgres:
    image: postgres:16.13-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shortlinks}
      POSTGRES_USER: ${POSTGRES_USER:-shortlinks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4.8-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: [sh, -c, 'exec redis-server --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD-SHELL, 'if [ -n "$$REDIS_PASSWORD" ]; then export REDISCLI_AUTH="$$REDIS_PASSWORD"; fi; redis-cli ping']
      interval: 5s
      timeout: 2s
      retries: 5

volumes:
  postgres-data:
  redis-data:
